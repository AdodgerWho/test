plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.driverlogger'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.driverlogger"
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
